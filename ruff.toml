line-length = 100
indent-width = 2
target-version = "py39" # Minimum jax version

[format]
indent-style = "space"
docstring-code-format = true

[lint]
select =[
"E", # pycodestyle error
"F", # pyflake
"W", # whitespace
"NPY", # numpy
"TID", # tidy-imports
"B", # bugbear
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

ignore = [
"E402", # import at top of file
"E731", # Do not assign a lambda expression, use a def 
"E741", # Don't use I, O, l as variable names
"F401", # unused import
"E701", # allow Multiple statements on one line (colon)
"PT023",# ignore @pytest.mark.slow
"B011", # Do not assert False
"TID252", # no relative imports from parents (may remove this when making a release package)
"NPY002", # use legacy np.random.randn instead of np.random.Generator.standard_normal
]

# Ignore `E402` (import violations) in all `__init__.py` files, and in `path/to/file.py`.
[lint.per-file-ignores]
"__init__.py" = ["E402"]
